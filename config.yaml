# ============================================================
# LiteLLM Proxy Configuration
# Clawflow hybrid model gateway
# Run: litellm --config config.yaml --port 4000
# ============================================================

model_list:
  # Router used only when the deterministic pre-filter is inconclusive.
  - model_name: local-router
    litellm_params:
      model: ollama/deepseek-r1:8b
      api_base: "http://localhost:11434"

  # Legacy aliases retained during migration.
  - model_name: local-worker
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: "http://localhost:11434"

  - model_name: local-helper
    litellm_params:
      model: ollama/phi4-mini:latest
      api_base: "http://localhost:11434"

  - model_name: cloud-pm-gemini
    litellm_params:
      model: gemini/gemini-3-pro
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: cloud-pm-claude
    litellm_params:
      model: anthropic/claude-4-6-sonnet
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: cloud-pm-gpt4
    litellm_params:
      model: openai/gpt-5.3-codex
      api_key: "os.environ/OPENAI_API_KEY"

  # Stable policy aliases consumed by core/model_policy.py.
  - model_name: local-fast
    litellm_params:
      model: ollama/phi4-mini:latest
      api_base: "http://localhost:11434"

  - model_name: local-quality
    litellm_params:
      model: ollama/qwen2.5-coder:32b
      api_base: "http://localhost:11434"

  - model_name: cloud-general
    litellm_params:
      model: gemini/gemini-3-pro
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: cloud-specialist
    litellm_params:
      model: anthropic/claude-4-6-sonnet
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: cloud-coding
    litellm_params:
      model: openai/gpt-5.3-codex
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: cloud-reasoning
    litellm_params:
      model: anthropic/claude-4-6-sonnet
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: cloud-long-context
    litellm_params:
      model: gemini/gemini-3-pro
      api_key: "os.environ/GEMINI_API_KEY"

  # Optional OpenAI-compatible local endpoint, e.g. Colibri GLM-5.2.
  - model_name: deep-local
    litellm_params:
      model: openai/glm-5.2-colibri
      api_base: "http://localhost:8000/v1"
      api_key: "local-secret"
      timeout: 1800

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300
  fallbacks:
    - cloud-general:
        - cloud-specialist
        - local-quality
    - cloud-coding:
        - cloud-specialist
        - local-quality
    - cloud-reasoning:
        - cloud-specialist
        - cloud-general
    - cloud-long-context:
        - cloud-general
    - local-fast:
        - local-quality

litellm_settings:
  drop_params: true
  request_timeout: 300

# MCP Servers
mcp_servers:
  demo_server:
    command: "python"
    args: ["utils/demo_mcp_server.py"]
