name: Policy Routing Tests

on:
  pull_request:
    paths:
      - "agents/router.py"
      - "api/graph_adapter.py"
      - "api/server.py"
      - "core/routing_schema.py"
      - "core/model_policy.py"
      - "core/orchestration_graph.py"
      - "core/runtime.py"
      - "core/cli_controller.py"
      - "core/graph.py"
      - "config.yaml"
      - "main_graph.py"
      - "tests/test_routing_policy.py"
      - "tests/test_orchestration_graph.py"
      - "tests/test_graph_factory.py"
      - "tests/test_graph_runtime_entrypoint.py"
      - "tests/test_api_graph_adapter.py"
      - "tests/test_native_hitl_resume.py"
      - "tests/test_graph_cli_controller.py"
      - ".github/workflows/policy-routing-tests.yml"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            openai==2.21.0 \
            pydantic==2.12.5 \
            pyyaml==6.0.3 \
            python-dotenv==1.2.1 \
            langgraph==1.0.9 \
            pytest \
            pytest-asyncio

      - name: Run routing, API, HITL, and CLI regression tests
        run: |
          pytest -q \
            tests/test_routing_policy.py \
            tests/test_orchestration_graph.py \
            tests/test_graph_factory.py \
            tests/test_graph_runtime_entrypoint.py \
            tests/test_api_graph_adapter.py \
            tests/test_native_hitl_resume.py \
            tests/test_graph_cli_controller.py
